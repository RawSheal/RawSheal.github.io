<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <label for="numberOfPlayers">Number of Players:</label>
        <input type="number" name="numberOfPlayers" id="numberOfPlayers" max="2" min="2" value="2">
        <button id="getNumberOfPlayer">Play</button>
    </div>

    <div id="table">
        <nav>
            <button id="dealButton">Deal</button>
            <button id="backToMenu">Menu</button>
        </nav>
        
        <div id="player">
            <div id="player1">
                <div>
                    <button id="player1Reveal1">reveal 1 card</button>
                    <button id="player1Reveal3">reveal all 3 cards</button>
                </div>
                <div class="cards" style="display: flex; width:100%; justify-content:center;">
                        <div class="player1card">
                            <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                        </div>
                        <div class="player1card">
                            <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                        </div>
                        <div class="player1card">
                            <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                        </div>
                </div>
                
            </div>
            <div id="player2">


                <div class="cards" style="display: flex; width:100%; justify-content:center;">
                            <div class="player2card">
                    <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                </div>
                <div class="player2card">
                    <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                </div>
                <div class="player2card">
                    <img src="./cards/PNG-cards-1.3/z_back_of_card.png" height="100%" width="50%">
                </div>
                </div>
                <div>
                    <button id="player2Reveal1">reveal 1 card</button>
                    <button id="player2Reveal3">reveal all 3 cards</button>
                </div>
            </div>
        </div>
        
    </div>

    <script src="./main.js"></script>
</body>
</html>
